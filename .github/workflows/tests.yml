name: fleet-tests

# Gate every push/PR on the agent test suite so a bad commit can never reach the
# deploy step (~/.hermes/scripts).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: pip install pytest
      - name: Run unit + smoke tests
        run: python -m pytest tests -q
